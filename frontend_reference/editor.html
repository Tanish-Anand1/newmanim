<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivacity Editor — Frame-by-frame animation editor</title>
<link rel="preload" href="/app/fonts/GeistPixel-Regular-VariableFont_ELSH.ttf" as="font" type="font/ttf" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505; --bg-1: #0e0e0e; --bg-2: #161616; --bg-3: #1e1e1e;
  --border: rgba(255,255,255,0.06); --border-bright: rgba(255,255,255,0.14);
  --t1: #ffffff; --t2: rgba(255,255,255,0.68); --t3: rgba(255,255,255,0.35);
  --accent: #00c3ff; --accent-dim: rgba(0,195,255,0.11);
  --green: #00e676; --green-dim: rgba(0,230,118,0.12);
  --red: #ff4466; --red-dim: rgba(255,68,102,0.12);
  --gold: #fbbf24;
  --font: 'Inter', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --r-xs: 6px; --r-sm: 10px; --r-md: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--t1); height: 100vh; overflow: hidden; }

/* ── Layout ── */
#app { display: grid; grid-template-rows: 52px 1fr; height: 100vh; }
.topbar { display: flex; align-items: center; padding: 0 20px; gap: 16px;
  background: rgba(10,10,10,0.9); border-bottom: 1px solid var(--border); }
.topbar-brand { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
.topbar-brand span { color: var(--accent); }
.topbar-status { font-size: 12px; color: var(--t3); margin-left: auto; }
.topbar-actions { display: flex; gap: 8px; }

.main { display: grid; grid-template-columns: 1fr 380px; height: 100%; overflow: hidden; }

/* ── Video Preview ── */
.preview { display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #000; position: relative; padding: 20px; }
.preview video { max-height: 90%; max-width: 100%; border-radius: var(--r-sm); }
.preview-placeholder { color: var(--t3); font-size: 14px; }

/* ── Timeline ── */
.timeline-panel { display: flex; flex-direction: column; border-left: 1px solid var(--border);
  background: var(--bg-1); }
.timeline-header { padding: 14px 16px; border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--t2); display: flex; justify-content: space-between; align-items: center; }
.timeline-header .count { font-size: 11px; color: var(--t3); font-weight: 400; }

.timeline-scroll { flex: 1; overflow-y: auto; padding: 12px; display: flex;
  flex-direction: column; gap: 10px; }

/* ── Beat Card ── */
.beat-card { background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--r-sm); overflow: hidden; cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s; }
.beat-card:hover { border-color: rgba(0,195,255,0.3); }
.beat-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.beat-card.accepted { border-color: var(--green); }
.beat-card.rejected { border-color: var(--red); opacity: 0.5; }
.beat-card.editing { border-color: var(--gold); }

.beat-thumb { width: 100%; aspect-ratio: 9/16; background: #000; object-fit: cover;
  display: block; max-height: 120px; }
.beat-body { padding: 10px 12px; }
.beat-meta { display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--t3); margin-bottom: 6px; }
.beat-number { font-weight: 600; color: var(--t2); }
.beat-duration { font-family: var(--mono); font-size: 10px; }
.beat-label { font-size: 12px; color: var(--t2); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; }

.beat-status { display: flex; gap: 4px; align-items: center; }
.beat-status .dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.pending { background: var(--t3); }
.dot.accepted { background: var(--green); }
.dot.editing { background: var(--gold); }

/* ── Editor Panel ── */
.editor-panel { display: none; position: fixed; top: 52px; right: 380px;
  width: 420px; bottom: 0; background: var(--bg-1); border-left: 1px solid var(--border);
  z-index: 100; flex-direction: column; }
.editor-panel.open { display: flex; }
.editor-header { padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center; }
.editor-header h3 { font-size: 13px; font-weight: 600; }
.editor-close { background: none; border: none; color: var(--t3); cursor: pointer;
  font-size: 18px; }
.editor-close:hover { color: var(--t1); }

.editor-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex;
  flex-direction: column; gap: 14px; }

.editor-field label { display: block; font-size: 11px; color: var(--t3);
  text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.editor-field textarea, .editor-field input { width: 100%; background: var(--bg-3);
  border: 1px solid var(--border); border-radius: var(--r-xs); padding: 10px 12px;
  color: var(--t1); font-size: 13px; font-family: var(--font); outline: none;
  resize: vertical; min-height: 60px; transition: border-color 0.2s; }
.editor-field textarea:focus, .editor-field input:focus { border-color: var(--accent); }

.editor-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.btn { padding: 8px 16px; border-radius: var(--r-xs); font-size: 12px;
  font-weight: 600; border: none; cursor: pointer; transition: opacity 0.2s;
  font-family: var(--font); }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-green { background: var(--green); color: #000; }
.btn-red { background: var(--red); color: #fff; }
.btn-ghost { background: transparent; color: var(--t2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--bg-3); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-gold { background: var(--gold); color: #000; }

.editor-preview { width: 100%; aspect-ratio: 9/16; background: #000;
  border-radius: var(--r-xs); max-height: 200px; object-fit: cover; }

/* ── Accept/Reject overlay on beat thumb ── */
.beat-badge { position: absolute; top: 6px; right: 6px; font-size: 10px;
  padding: 2px 7px; border-radius: 4px; font-weight: 600; display: none; }
.beat-thumb-wrap { position: relative; }
.beat-thumb-wrap .badge-accepted { background: var(--green); color: #000; }
.beat-thumb-wrap .badge-rejected { background: var(--red); color: #fff; }
.beat-thumb-wrap .badge-editing { background: var(--gold); color: #000; }

/* ── Utility ── */
.spinner { width: 14px; height: 14px; border: 2px solid var(--t3);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.6s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.flex-center { display: flex; align-items: center; justify-content: center; gap: 8px; }
.text-subtle { color: var(--t3); font-size: 12px; }
.mt-8 { margin-top: 8px; }
.gap-6 { gap: 6px; }
</style>
</head>
<body>

<div id="app">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-brand"><span>Vivacity</span> Editor</div>
    <div class="topbar-status" id="statusBar">No video loaded</div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-sm" onclick="loadSampleJob()">Load Sample</button>
      <button class="btn btn-primary btn-sm" onclick="stitchAll()">Stitch & Final Render</button>
    </div>
  </div>

  <div class="main">
    <!-- Left: Video Preview -->
    <div class="preview" id="previewArea">
      <div class="preview-placeholder" id="placeholder">Select a beat to preview<br><span class="text-subtle">Click any segment in the timeline</span></div>
      <video id="mainVideo" controls style="display:none"></video>
    </div>

    <!-- Right: Timeline -->
    <div class="timeline-panel">
      <div class="timeline-header">
        <span>Beat Timeline</span>
        <span class="count" id="beatCount">0 beats</span>
      </div>
      <div class="timeline-scroll" id="timeline"></div>
    </div>
  </div>
</div>

<!-- Editor Slide Panel -->
<div class="editor-panel" id="editorPanel">
  <div class="editor-header">
    <h3 id="editorTitle">Edit Beat</h3>
    <button class="editor-close" onclick="closeEditor()">✕</button>
  </div>
  <div class="editor-scroll">
    <div class="editor-field">
      <label>ON SCREEN (what appears in animation)</label>
      <textarea id="editOnScreen" rows="2"></textarea>
    </div>
    <div class="editor-field">
      <label>VO (voiceover narration)</label>
      <textarea id="editVo" rows="2"></textarea>
    </div>
    <div class="editor-field">
      <label>Edit prompt (describe what to change)</label>
      <textarea id="editPrompt" rows="2" placeholder="e.g. Make the graph animate from left to right, use blue color for the curve"></textarea>
    </div>
    <div class="editor-field">
      <label>Preview of regenerated segment</label>
      <video id="editPreviewVideo" class="editor-preview" controls style="display:none"></video>
      <div id="editPreviewPlaceholder" class="flex-center text-subtle" style="height:120px;background:var(--bg-3);border-radius:var(--r-xs);">
        Click "Regenerate" to preview
      </div>
    </div>
    <div class="editor-actions">
      <button class="btn btn-primary" id="btnRegen" onclick="regenerateBeat()">🔄 Regenerate</button>
      <button class="btn btn-green" id="btnAccept" onclick="acceptBeat()" disabled>✓ Accept</button>
      <button class="btn btn-red" id="btnReject" onclick="rejectBeat()" disabled>✕ Reject</button>
      <button class="btn btn-ghost" onclick="closeEditor()">Cancel</button>
    </div>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────
const BACKEND = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? '' : 'https://vivacity-api.onrender.com';
let currentJobId = null;
let beats = [];
let selectedBeatIndex = null;
let regeneratedBeatUrl = null;
let beatStatus = {}; // { beatNumber: 'original' | 'accepted' | 'rejected' | 'editing' }

// ─── Load a sample job ────────────────────────────────────────────────────
async function loadSampleJob() {
  // Find the most recent complete job
  // For demo, we hardcode. In production, this would list recent jobs.
  document.getElementById('statusBar').textContent = 'Loading...';
  
  // Try to load the last escape velocity or KE video from the job list
  // Actually, let the user paste a job ID
  const jobId = prompt('Enter a job ID to edit, or leave blank to generate a new one:', '');
  if (jobId) {
    await loadJob(jobId);
  } else {
    await createAndLoadJob();
  }
}

async function loadJob(jobId) {
  try {
    const res = await fetch(`${BACKEND}/api/jobs/${jobId}`);
    if (!res.ok) throw new Error('Job not found');
    const job = await res.json();
    if (job.status !== 'complete') throw new Error('Job is not complete yet');
    
    currentJobId = jobId;
    document.getElementById('statusBar').textContent = `Editing: ${job.id.slice(0,8)}... | ${job.duration_seconds}s`;
    
    // Load beats
    await loadBeats(jobId);
    
    // Show video
    const video = document.getElementById('mainVideo');
    const url = job.output_video_url.startsWith('http') ? job.output_video_url : `${BACKEND}${job.output_video_url}`;
    video.src = url;
    video.style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
    
  } catch (e) {
    alert('Error: ' + e.message);
    document.getElementById('statusBar').textContent = 'Error loading job';
  }
}

async function createAndLoadJob() {
  const topic = prompt('Enter a topic for the sample video:', 'kinetic energy formula KE equals half m v squared');
  if (!topic) return;
  
  document.getElementById('statusBar').textContent = 'Generating video...';
  
  try {
    const res = await fetch(`${BACKEND}/api/generate`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        storyboard: `# Topic: ${topic}\n[0-5] ON SCREEN: KE formula half m v squared | VO: "Kinetic energy is half mass times velocity squared."\n[5-10] ON SCREEN: doubling speed quadruples energy | VO: "Doubling speed quadruples kinetic energy."`,
        scene_name: 'EditorDemoScene',
        orientation: 'portrait',
        pipeline_profile: 'template'
      })
    });
    const data = await res.json();
    
    // Poll until complete
    document.getElementById('statusBar').textContent = 'Rendering...';
    await pollJob(data.job_id);
    
  } catch (e) {
    alert('Generation error: ' + e.message);
    document.getElementById('statusBar').textContent = 'Generation failed';
  }
}

async function pollJob(jobId) {
  return new Promise((resolve, reject) => {
    const poll = setInterval(async () => {
      try {
        const res = await fetch(`${BACKEND}/api/jobs/${jobId}`);
        const job = await res.json();
        document.getElementById('statusBar').textContent = `Status: ${job.status} — ${job.progress_message}`;
        
        if (job.status === 'complete') {
          clearInterval(poll);
          await loadJob(jobId);
          resolve();
        } else if (job.status === 'failed') {
          clearInterval(poll);
          reject(new Error(job.error || 'Generation failed'));
        }
      } catch (e) {
        // retry
      }
    }, 2000);
  });
}

// ─── Load Beats ────────────────────────────────────────────────────────────
async function loadBeats(jobId) {
  try {
    const res = await fetch(`${BACKEND}/api/jobs/${jobId}/beats`);
    if (!res.ok) return;
    beats = await res.json();
    
    // Initialize all beats as original
    beats.forEach(b => { beatStatus[b.beat_number] = 'original'; });
    
    renderTimeline();
    document.getElementById('beatCount').textContent = `${beats.length} beats`;
  } catch (e) {
    console.error('Failed to load beats:', e);
  }
}

// ─── Render Timeline ──────────────────────────────────────────────────────
function renderTimeline() {
  const container = document.getElementById('timeline');
  container.innerHTML = '';
  
  beats.forEach((beat, idx) => {
    const status = beatStatus[beat.beat_number] || 'original';
    const statusClass = status === 'accepted' ? 'accepted' : status === 'editing' ? 'editing' : '';
    const activeClass = idx === selectedBeatIndex ? 'active' : '';
    
    const thumbUrl = beat.thumbnail_url 
      ? (beat.thumbnail_url.startsWith('http') ? beat.thumbnail_url : `${BACKEND}${beat.thumbnail_url}`)
      : '';
    
    const badgeHTML = status === 'accepted' ? '<span class="beat-badge" style="display:block;background:var(--green);color:#000;top:6px;right:6px;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;position:absolute;">✓ Accepted</span>'
      : status === 'editing' ? '<span class="beat-badge" style="display:block;background:var(--gold);color:#000;top:6px;right:6px;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;position:absolute;">Editing</span>'
      : '';
    
    const statusDot = status === 'accepted' ? '<span class="dot accepted"></span>'
      : status === 'editing' ? '<span class="dot editing"></span>'
      : '<span class="dot pending"></span>';
    
    const card = document.createElement('div');
    card.className = `beat-card ${activeClass} ${statusClass}`;
    card.onclick = () => selectBeat(idx);
    card.innerHTML = `
      <div class="beat-thumb-wrap">
        ${thumbUrl ? `<img class="beat-thumb" src="${thumbUrl}" alt="Beat ${beat.beat_number}" />` : `<div class="beat-thumb flex-center text-subtle">Beat ${beat.beat_number}</div>`}
        ${badgeHTML}
      </div>
      <div class="beat-body">
        <div class="beat-meta">
          <span class="beat-number">Beat ${beat.beat_number}</span>
          <span class="beat-duration">${beat.start.toFixed(1)}s - ${beat.end.toFixed(1)}s</span>
        </div>
        <div class="beat-label">${beat.on_screen || '(no content)'}</div>
        <div class="beat-meta" style="margin-top:6px">
          <div class="beat-status">${statusDot} ${status}</div>
        </div>
      </div>
    `;
    container.appendChild(card);
  });
}

// ─── Select Beat → Open Editor ────────────────────────────────────────────
function selectBeat(idx) {
  selectedBeatIndex = idx;
  const beat = beats[idx];
  
  // Mark as editing
  if (beatStatus[beat.beat_number] === 'original') {
    beatStatus[beat.beat_number] = 'editing';
  }
  
  renderTimeline();
  openEditor(beat);
  
  // Seek video to this beat's start time
  const video = document.getElementById('mainVideo');
  if (video.src) {
    video.currentTime = beat.start;
    video.play().catch(() => {});
  }
}

function openEditor(beat) {
  document.getElementById('editorTitle').textContent = `Edit Beat ${beat.beat_number} (${beat.start.toFixed(1)}s - ${beat.end.toFixed(1)}s)`;
  document.getElementById('editOnScreen').value = beat.on_screen || '';
  document.getElementById('editVo').value = beat.vo_text || '';
  document.getElementById('editPrompt').value = '';
  document.getElementById('editPreviewVideo').style.display = 'none';
  document.getElementById('editPreviewPlaceholder').style.display = 'flex';
  document.getElementById('btnAccept').disabled = true;
  document.getElementById('btnReject').disabled = true;
  document.getElementById('btnRegen').disabled = false;
  regeneratedBeatUrl = null;
  
  document.getElementById('editorPanel').classList.add('open');
}

function closeEditor() {
  document.getElementById('editorPanel').classList.remove('open');
  if (selectedBeatIndex !== null) {
    const beat = beats[selectedBeatIndex];
    if (beatStatus[beat.beat_number] === 'editing') {
      beatStatus[beat.beat_number] = 'original';
    }
    renderTimeline();
  }
  selectedBeatIndex = null;
}

// ─── Regenerate Beat ──────────────────────────────────────────────────────
async function regenerateBeat() {
  if (selectedBeatIndex === null) return;
  const beat = beats[selectedBeatIndex];
  
  const onScreen = document.getElementById('editOnScreen').value.trim();
  const voText = document.getElementById('editVo').value.trim();
  const prompt = document.getElementById('editPrompt').value.trim();
  
  if (!onScreen && !prompt) {
    alert('Enter ON SCREEN content or an edit prompt.');
    return;
  }
  
  // Disable buttons during regeneration
  document.getElementById('btnRegen').disabled = true;
  document.getElementById('btnRegen').textContent = '⏳ Regenerating...';
  document.getElementById('editPreviewPlaceholder').textContent = 'Generating...';
  
  try {
    // Use the prompt if provided, otherwise use on_screen
    const effectiveOnScreen = prompt ? `${onScreen} (user edit: ${prompt})` : onScreen;
    
    const res = await fetch(`${BACKEND}/api/jobs/${currentJobId}/beats/${beat.beat_number}/regenerate`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        on_screen: effectiveOnScreen,
        vo_text: voText || '(silent)'
      })
    });
    
    if (!res.ok) {
      const err = await res.text();
      throw new Error(err);
    }
    
    const { job_id } = await res.json();
    
    // Poll the new child job until complete
    await pollChildJob(job_id, beat);
    
  } catch (e) {
    alert('Regeneration failed: ' + e.message);
    document.getElementById('btnRegen').disabled = false;
    document.getElementById('btnRegen').textContent = '🔄 Regenerate';
    document.getElementById('editPreviewPlaceholder').textContent = 'Regeneration failed. Try again.';
  }
}

async function pollChildJob(jobId, beat) {
  return new Promise((resolve, reject) => {
    const poll = setInterval(async () => {
      try {
        const res = await fetch(`${BACKEND}/api/jobs/${jobId}`);
        const job = await res.json();
        
        if (job.status === 'complete') {
          clearInterval(poll);
          
          // Show the regenerated segment preview
          const videoUrl = job.output_video_url.startsWith('http') 
            ? job.output_video_url 
            : `${BACKEND}${job.output_video_url}`;
          
          regeneratedBeatUrl = videoUrl;
          
          const previewVideo = document.getElementById('editPreviewVideo');
          previewVideo.src = videoUrl;
          previewVideo.style.display = 'block';
          document.getElementById('editPreviewPlaceholder').style.display = 'none';
          
          // Enable accept/reject
          document.getElementById('btnAccept').disabled = false;
          document.getElementById('btnReject').disabled = false;
          document.getElementById('btnRegen').disabled = false;
          document.getElementById('btnRegen').textContent = '🔄 Regenerate Again';
          
          resolve();
        } else if (job.status === 'failed') {
          clearInterval(poll);
          reject(new Error(job.error || 'Regeneration failed'));
        }
      } catch (e) {
        // retry
      }
    }, 2000);
  });
}

// ─── Accept / Reject ──────────────────────────────────────────────────────
function acceptBeat() {
  if (selectedBeatIndex === null) return;
  const beat = beats[selectedBeatIndex];
  beatStatus[beat.beat_number] = 'accepted';
  
  // Update the beat's thumbnail to the regenerated version (if available)
  if (regeneratedBeatUrl) {
    beat.thumbnail_url = regeneratedBeatUrl;
  }
  
  renderTimeline();
  closeEditor();
  
  // Check if all beats are accepted
  checkAllAccepted();
}

function rejectBeat() {
  if (selectedBeatIndex === null) return;
  const beat = beats[selectedBeatIndex];
  beatStatus[beat.beat_number] = 'original';
  
  regeneratedBeatUrl = null;
  document.getElementById('btnAccept').disabled = true;
  document.getElementById('btnReject').disabled = true;
  document.getElementById('editPreviewVideo').style.display = 'none';
  document.getElementById('editPreviewPlaceholder').style.display = 'flex';
  document.getElementById('editPreviewPlaceholder').textContent = 'Regeneration rejected. Edit and try again.';
}

function checkAllAccepted() {
  const all = beats.every(b => beatStatus[b.beat_number] === 'accepted');
  if (all) {
    document.getElementById('statusBar').textContent = '✅ All beats accepted! Click "Stitch & Final Render"';
  } else {
    const accepted = beats.filter(b => beatStatus[b.beat_number] === 'accepted').length;
    document.getElementById('statusBar').textContent = `${accepted}/${beats.length} beats accepted`;
  }
}

// ─── Stitch All ───────────────────────────────────────────────────────────
async function stitchAll() {
  const accepted = beats.filter(b => beatStatus[b.beat_number] === 'accepted').length;
  if (accepted < beats.length) {
    if (!confirm(`${accepted}/${beats.length} beats accepted. Unaccepted beats will use the original version. Continue?`)) return;
  }
  
  document.getElementById('statusBar').textContent = '⏳ Stitching final video...';
  
  // The current video URL already contains the complete video with original beats.
  // For the stitched version with regenerated beats, this would need a backend
  // endpoint that combines original + regenerated segments.
  // For now, we reload the original complete video.
  
  alert('Stitching will combine all accepted beat changes into a final video.\n\nThis endpoint will be added to the backend. For now, the original video is still available.');
  
  try {
    const res = await fetch(`${BACKEND}/api/jobs/${currentJobId}`);
    const job = await res.json();
    const url = job.output_video_url.startsWith('http') ? job.output_video_url : `${BACKEND}${job.output_video_url}`;
    
    const video = document.getElementById('mainVideo');
    video.src = url;
    video.load();
    video.play().catch(() => {});
    
    document.getElementById('statusBar').textContent = '✅ Final video loaded. Accept/reject cycle complete.';
  } catch (e) {
    alert('Error loading final video: ' + e.message);
  }
}

// ─── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeEditor();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) regenerateBeat();
});
// Auto-load job from URL parameter
const urlJob = new URLSearchParams(location.search).get("job");
if (urlJob) { setTimeout(() => loadJob(urlJob), 500); }
</script>
</body>
</html>
